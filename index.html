<!doctype html>
<html dir='ltr' lang='en-US'>
<head>
    <meta charset='UTF-8'>
    <meta content='IE=edge' http-equiv='X-UA-Compatible'/>
    <meta content='width=device-width, initial-scale=1.0' name='viewport'>
    <meta content='Mahdi Abdurrahman' name='author'>
    <meta content='Rock paper scissors is a hand game played between two players, where one player is human and the other is the computer. Each player simultaneously forms one of three shapes: rock (a fist), paper (a flat hand), or scissors (a fist with the index and middle fingers extended). The game has three possible outcomes: rock crushes scissors, scissors cuts paper, and paper covers rock, with ties resulting in a replay.'
          name='description'>
    <meta content='HTML5, CSS3, JavaScript, Rock, Paper, Scissors Game'
          name='keywords'>
    <title>Rock, Paper, Scissors</title>
    <!-- google fonts -->
    <link href='https://fonts.googleapis.com' rel='preconnect'>
    <link crossorigin href='https://fonts.gstatic.com' rel='preconnect'>
    <link href='https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap'
          rel='stylesheet'>
    <!-- fontawesome -->
    <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css'
          rel='stylesheet'>
    <!-- normalize css -->
    <link href='./css/normalize.css' rel='stylesheet'>
    <!-- main styles -->
    <link href='./css/styles.css' rel='stylesheet'/>
    <!-- javascript -->
    <script defer src='./js/scripts.js'></script>
</head>
<body>
<main class='main-content'>
    <section class='utils-container'>
        <h3 class='game-title'>Rock Paper Scissors</h3>
        <div class='game-container'>
            <div class='game-images'>
            <div class='user_result'>
                <h5 class='sub-title'>Human</h5>
                <img alt='User choice' class='game-image user-choice'
                     src='./img/rock.png'/>
            </div>
                <div class='computer_result'>
                    <h5 class='sub-title'>Computer</h5>
                <img alt='Computer choice' class='game-image computer-choice'
                     src='./img/rock.png'/>
            </div>
            </div>
        </div>
    </section>


</main>

</body>
</html>
